name: Optional official MCP v2 acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build.py
      - run: npm init -y && npm install @modelcontextprotocol/client@^2
      - name: Start gateway
        env:
          MCP_DEMO_HS256_SECRET: 0123456789abcdef0123456789abcdef
          MCP_GATEWAY_PORT: '18096'
        run: |
          java -cp build/classes io.ahad.mcpgateway.Main > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:18096/health && break; sleep .1; done
      - name: Issue demo access token
        run: echo "MCP_TEST_TOKEN=$(python scripts/issue_demo_token.py --secret 0123456789abcdef0123456789abcdef --subject sdk-client --tenant acme --scope 'orders:read')" >> "$GITHUB_ENV"
      - name: Connect with official v2 client
        run: node tests/mcp_sdk_smoke.mjs
      - if: always()
        run: cat /tmp/gateway.log || true
